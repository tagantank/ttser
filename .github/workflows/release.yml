name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  macos:
    name: Build and publish macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            jobs: "3"
          - runner: macos-15-intel
            arch: x86_64
            jobs: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native tools
        run: brew install cmake ffmpeg

      - name: Install Python deps
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip
          python -m pip install -e . 'PySide6==6.11.2' 'pyinstaller>=6.3'

      - name: Build unsigned .app / .dmg
        env:
          JOBS: ${{ matrix.jobs }}
          TTSER_ARCH: ${{ matrix.arch }}
          TTSER_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          source .venv/bin/activate
          bash macos/build_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ttser-macos-${{ matrix.arch }}
          path: |
            dist/ttser-*.dmg
            dist/ttser-*.dmg.sha256
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: false
          append_body: true
          fail_on_unmatched_files: true
          files: |
            dist/ttser-${{ github.ref_name }}-macos-${{ matrix.arch }}.dmg
            dist/ttser-${{ github.ref_name }}-macos-${{ matrix.arch }}.dmg.sha256
          body: |
            Unsigned macOS `.app` / `.dmg` (`${{ matrix.arch }}`) for `${{ github.ref_name }}`. Not notarized.

            1. Open the matching DMG (`macos-arm64` for Apple Silicon, `macos-x86_64` for Intel) and drag `ttser.app` to Applications.
            2. Right-click `ttser.app` → Open, then confirm Open (Gatekeeper).
            3. Download a GGUF model in Settings (`~/Library/Application Support/ttser/models`).

  flatpak:
    name: Build and publish Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download PySide wheels
        run: |
          set -euo pipefail
          mkdir -p flatpak/wheels
          if ! python3 -m pip --version >/dev/null 2>&1; then
            dnf install -y python3-pip
          fi
          python3 -m pip download --dest flatpak/wheels 'PySide6==6.11.2'
          ls -lh flatpak/wheels

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ttser.flatpak
          manifest-path: flatpak/com.tagantank.ttser.yml
          cache-key: ttser-flatpak-24.08
          upload-artifact: true

      - name: Name bundle and checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          ARTIFACT="ttser-${VERSION}-linux-x86_64.flatpak"
          mv ttser.flatpak "${ARTIFACT}"
          sha256sum "${ARTIFACT}" | tee "${ARTIFACT}.sha256"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          append_body: true
          fail_on_unmatched_files: true
          files: |
            ttser-${{ github.ref_name }}-linux-x86_64.flatpak
            ttser-${{ github.ref_name }}-linux-x86_64.flatpak.sha256
          body: |
            Linux Flatpak for `${{ github.ref_name }}`.

            ```bash
            flatpak install --user --bundle ttser-${{ github.ref_name }}-linux-x86_64.flatpak
            flatpak run com.tagantank.ttser
            ```
