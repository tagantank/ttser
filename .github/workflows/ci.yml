name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            jobs: "3"
          - runner: macos-15-intel
            arch: x86_64
            jobs: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native tools
        run: brew install cmake ffmpeg

      - name: Install Python deps
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -U pip
          python -m pip install -e . 'PySide6==6.11.2' 'pyinstaller>=6.3'

      - name: Build unsigned .app / .dmg
        env:
          JOBS: ${{ matrix.jobs }}
          TTSER_ARCH: ${{ matrix.arch }}
        run: |
          source .venv/bin/activate
          bash macos/build_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ttser-macos-${{ matrix.arch }}
          path: |
            dist/ttser-*.dmg
            dist/ttser-*.dmg.sha256
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download PySide wheels
        run: |
          set -euo pipefail
          mkdir -p flatpak/wheels
          if ! python3 -m pip --version >/dev/null 2>&1; then
            dnf install -y python3-pip
          fi
          python3 -m pip download --dest flatpak/wheels 'PySide6==6.11.2'
          ls -lh flatpak/wheels

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ttser.flatpak
          manifest-path: flatpak/com.tagantank.ttser.yml
          cache-key: ttser-flatpak-24.08
          upload-artifact: true
