[project]
name = "ttser"
version = "0.2.0"
description = "Desktop TTS app for Fish Audio S2 Pro"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
]

[project.scripts]
ttser = "ttser.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ttser", "engine"]

[tool.setuptools.package-data]
ttser = ["resources/*.png"]
